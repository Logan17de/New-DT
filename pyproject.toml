[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-dt"
version = "0.3.0"
description = "Scalar-neuron Dynamic Transformer with SPRC route storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["datasets>=3.0"]

[project.scripts]
new-dt-compare = "new_dt.training_cli:main"
new-dt-prepare-sciq = "new_dt.prepare_sciq:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["new_dt*"]
