[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-dt"
version = "0.1.0"
description = "Reference implementation of a token-owned scalar-pool Dynamic Transformer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["new_dt*"]
