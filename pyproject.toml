[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-dt"
version = "0.8.0"
description = "Dynamic Transformer research models with lookup, hybrid, projected MOD, live dashboard, and SPRC backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["datasets>=3.0"]

[project.scripts]
new-dt-compare = "new_dt.lookup_training_cli:main"
new-dt-hybrid-compare = "new_dt.hybrid_training_cli:main"
new-dt-ffn-mod = "new_dt.ffn_mod_training_cli:main"
new-dt-all-models = "new_dt.all_models_dashboard_cli:main"
new-dt-prepare-sciq = "new_dt.prepare_sciq:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["new_dt*"]
